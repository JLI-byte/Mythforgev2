name: CI

# Until now nothing ran on a pull request, so the only thing standing between a
# regression and `main` was whoever remembered to run the checks by hand. These
# are exactly the four commands used during development, in the same order.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run pointless. Cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `next build` prerenders pages, which constructs the Supabase browser
      # client, which throws on a malformed URL. These are placeholders: CI is
      # proving the app COMPILES, not that it can reach a database. Nothing
      # here is a secret, and no real key belongs in this file.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if the lockfile is out of step with
      # package.json, which is a problem worth failing on.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # eslint is NOT clean on this repo and pretending otherwise would mean
      # either a permanently red build or deleting the check. Instead the count
      # is pinned: the build fails only if it goes UP. Three regressions during
      # the research board work were caught by exactly this signal, including a
      # stale-ref bug that would have shipped a column whose count never
      # updated.
      #
      # Lowering BASELINE as errors get fixed is the point. Raising it should
      # take an argument.
      - name: Lint (must not exceed the baseline)
        run: |
          set -euo pipefail
          BASELINE=223

          npx eslint src -f json > eslint.json || true
          COUNT=$(node -e "
            const r = require('./eslint.json');
            console.log(r.reduce((n, f) => n + f.errorCount, 0));
          ")

          echo "eslint errors: ${COUNT} (baseline ${BASELINE})"

          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::eslint errors rose from ${BASELINE} to ${COUNT}. Fix the new ones, or justify raising the baseline in the PR."
            node -e "
              const r = require('./eslint.json');
              for (const f of r) {
                if (!f.errorCount) continue;
                console.log(f.filePath.replace(process.cwd(), ''));
                for (const m of f.messages) {
                  if (m.severity === 2) console.log('  ' + m.line + ':' + m.column + '  ' + (m.ruleId || m.message));
                }
              }
            "
            exit 1
          fi

          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::eslint errors fell to ${COUNT}. Lower BASELINE in .github/workflows/ci.yml to lock that in."
          fi
