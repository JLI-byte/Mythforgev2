name: Supabase keep-alive

# Free-tier Supabase pauses a project that shows low activity over a
# rolling 7-day window. The bar is not "one request resets a timer" --
# the docs put it at "a few user requests to the database each day over
# the previous week", so what matters is sustained volume, not recency.
#
# This calls public.keepalive() every hour, which clears that bar with room to
# spare. PostgREST executes it in Postgres, so a 200 means the database
# genuinely answered.
#
# It used to select from public.workspaces instead. 20260904120100 revoked
# anon's SELECT on that table to take it out of the anonymous GraphQL schema,
# which broke this workflow silently: every run failed 42501 for two days and
# nothing surfaced it, because a red scheduled workflow shows up nowhere a
# pull request would. See supabase/migrations/20260907000000_keepalive_rpc.sql
# for why the replacement is a function rather than another table.
#
# NOTE: GitHub only fires `schedule` triggers from the default branch,
# so this file has to live on `main` to actually run. GitHub also
# disables scheduled workflows after 60 days of repo inactivity.

on:
  schedule:
    # Hourly. `schedule` is best-effort and GitHub drops runs under load,
    # so this is deliberately far above the threshold rather than at it.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY repo secret is not set."
            exit 1
          fi

          # Retry a few times so one transient network blip doesn't
          # burn the whole run and leave the project drifting toward a pause.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
              --max-time 30 -X POST \
              "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "000")

            if [ "$code" = "200" ]; then
              echo "Keep-alive OK (HTTP 200) on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt} failed with HTTP ${code}."
            [ "$attempt" -lt 3 ] && sleep 15
          done

          echo "::error::Keep-alive failed after 3 attempts (last HTTP ${code}). \
          The project may be paused, the anon key may have been rotated, or \
          anon may have lost EXECUTE on public.keepalive()."
          cat /tmp/response.txt || true
          exit 1
